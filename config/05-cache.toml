# =============================================================================
# config/05-cache.toml — in-memory search-result cache
# =============================================================================
#
# Caches the result list of each search (web/code/qa/docs, general and
# per-provider) keyed by the normalized query, so repeated identical searches
# don't re-hit rate-limited engines or burn StackExchange/GitHub quota. Retrieval
# tools (fetch_page, render_page, fetch_repo_file, wayback_fetch,
# qa_stackoverflow_answers) are cached too, in a separate in-memory store keyed by
# the request (so it never enters peer digests). Both use the settings below.
# In-memory only — cleared on restart, holds no secrets, and only successful
# (non-empty) results are stored.
# -----------------------------------------------------------------------------

[cache]
# Master switch. Env: LODESTONE_CACHE_ENABLED
enabled = true
# How long a cached result list stays fresh, in seconds. Env: LODESTONE_CACHE_TTL_SECS
ttl_secs = 300
# Maximum number of cached entries (memory bound). Env: LODESTONE_CACHE_MAX_ENTRIES
max_entries = 512
