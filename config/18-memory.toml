# =============================================================================
# config/18-memory.toml — persistent memory & solution-history skills (ON by default)
# =============================================================================
#
# Three tool families share one local SQLite store under `dir`:
#   * memory_*    a simple key→value store the model can write to remember things
#                 between sessions (memory_save / memory_get / memory_list /
#                 memory_search / memory_forget). Optional `scope` groups and `tags`.
#   * solution_*  proposed solutions to past problems, with full revision history
#                 and a typed link graph (solution_record / solution_find /
#                 solution_show / solution_list / solution_update / solution_forget
#                 plus solution_link / solution_unlink / solution_graph /
#                 solution_related). solution_find ranks exact canonical >
#                 exact concept > fuzzy Jaccard > substring, plus a tag boost.
#                 solution_update appends a new revision; prior revisions stay
#                 queryable via solution_show.
#   * synonym_*   single-token aliases (synonym_add / synonym_remove /
#                 synonym_list) folded into both `canonical_query` and
#                 `concept_tokens` — so a reworded later query still finds the
#                 prior cache slot and the prior solution.
#
# When `enabled = true`, an INTRINSIC RECALL wrapper also fires on every tool
# whose arguments carry a free-text `query`: matching prior solutions are
# prepended as a "💡 N prior solutions" advisory preamble, with outgoing typed
# links and a loud warning when the hit was superseded. The model never has to
# call solution_find by hand.
#
# Entries are LOCAL ONLY — never advertised in the constellation digest.
#
# memory_forget / solution_forget are DESTRUCTIVE: the first call returns a
# confirmation token and does nothing; call again with confirm=<token> (or
# confirm + trust=true to whitelist for the session). `allow_destructive = true`
# pre-authorizes (skips the prompt).
#
# Env overrides (every key below has a LODESTONE_MEMORY_<UPPER_SNAKE> form):
#   LODESTONE_MEMORY_ENABLED, LODESTONE_MEMORY_DIR,
#   LODESTONE_MEMORY_ALLOW_DESTRUCTIVE, LODESTONE_MEMORY_AUTO_RECALL,
#   LODESTONE_MEMORY_RECALL_THRESHOLD, LODESTONE_MEMORY_RECALL_MAX_HITS,
#   LODESTONE_MEMORY_SUPERSEDED_WALK_MAX_HOPS,
#   LODESTONE_MEMORY_RECORD_CONVERSATIONS,
#   LODESTONE_MEMORY_CONVERSATION_IDLE_GAP_SECS,
#   LODESTONE_MEMORY_CONVERSATION_TURN_EXCERPT_MAX_CHARS,
#   LODESTONE_MEMORY_RECORD_ONLY_QUERY_CALLS,
#   LODESTONE_MEMORY_CONVERSATION_RETENTION_DAYS,
#   LODESTONE_MEMORY_MAX_CONVERSATIONS,
#   LODESTONE_MEMORY_PRUNE_ON_STARTUP
# -----------------------------------------------------------------------------

[memory]
enabled = true                 # ON by default; set false to silence the whole family
dir = ".lodestone-memory"      # SQLite store lives here
allow_destructive = false      # true = skip the *_forget / conversation_prune prompts
max_entries = 10000            # soft cap on each store (memories or solutions)
max_value_chars = 64000        # per-value cap on memory `value` / solution `content`

# --- Intrinsic recall ------------------------------------------------------
auto_recall = true             # auto-prepend "💡 prior solutions" preambles
recall_threshold = 30.0        # match score floor — lower = chattier, higher = quieter
recall_max_hits = 3            # max solutions shown in one preamble
superseded_walk_max_hops = 5   # chain length the head walker chases; 0 = disable warning

# --- Conversation tracking -------------------------------------------------
record_conversations = true        # one row per tool call in conversation_turns
conversation_idle_gap_secs = 1800  # 30 min of silence ends a conversation; raise to merge sessions, lower to split
conversation_turn_excerpt_max_chars = 240
record_only_query_calls = false    # true = skip fs_read, arithmetic_eval, docker_ps — keeps the log intent-only

# --- Retention / pruning ---------------------------------------------------
conversation_retention_days = 0    # 0 = keep forever; >0 = auto-prune older
max_conversations = 0              # 0 = unlimited; >0 = keep N newest, drop the rest
prune_on_startup = false           # apply the two rules above at boot; verify with
                                   # `conversation_prune dry_run=true` first

# --- Semantic recall (optional) --------------------------------------------
# When set, every recorded solution / phrasing is embedded via this OpenAI-
# compatible endpoint and stored as a vector. Recall then scores by
# max(token_score, semantic_score) so a question worded *differently* from
# the original still surfaces the solution. Empty = disabled (no network
# dependency); failures degrade silently (token scoring continues).
embedding_endpoint = ""            # e.g. "http://127.0.0.1:1234/v1/embeddings" for LM Studio
embedding_model = "text-embedding-nomic-embed-text-v1.5"
embedding_threshold = 0.55         # cosine floor; tighten to 0.65+ for stricter matches

# --- Auto-aliasing on semantic-only hits -----------------------------------
# When the top recall hit fires *only* via the semantic path (token score
# below recall_threshold), attach the query as a new phrasing on that
# solution so future token-shaped recall finds it too. Closes the
# "we never solved this in these words" loop without the model having to
# remember to call solution_alias_add.
auto_alias_on_semantic_recall = true   # only effective when embedding_endpoint is set
auto_alias_min_query_tokens   = 3      # noise guard: skip 1-2 token queries like "campus"
