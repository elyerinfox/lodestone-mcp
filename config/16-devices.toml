# =============================================================================
# config/16-devices.toml — serial & printer skills (hardware; off by default)
# =============================================================================
#
# Direct hardware access, so both are OFF by default. Writes (serial_send,
# printer_print) go through the confirmation guard (first call returns a token;
# call again with confirm=<token>, or confirm + trust=true).
#
# Serial tools: serial_ports (list), serial_send, serial_read.
# Printer tools: printer_list, printer_print (CUPS `lp` on Unix, Windows spooler).
# -----------------------------------------------------------------------------

[serial]
# Expose the serial_* tools. Env: LODESTONE_SERIAL_ENABLED
enabled = false
# Default baud rate when a call omits it. Env: LODESTONE_SERIAL_BAUD
baud = 9600
# Default per-operation timeout (ms).
timeout_ms = 1000

[printer]
# Expose the printer_* tools. Env: LODESTONE_PRINTER_ENABLED
enabled = false

# Software-defined radio (sdr_devices / sdr_scan) — shells out to rtl_test /
# hackrf_info (discovery) and rtl_power (a spectrum sweep). OFF by default; needs
# the RTL-SDR / HackRF tools installed and hardware attached. RECEIVE-ONLY — no
# transmission path is exposed. Env: LODESTONE_SDR_ENABLED
[sdr]
enabled = false
