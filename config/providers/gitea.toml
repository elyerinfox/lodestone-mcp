# -----------------------------------------------------------------------------
# Provider: gitea  (kind: code) — a "forge" provider (gitea.com)
# -----------------------------------------------------------------------------
# Searches gitea.com code via a site-scoped web search (DuckDuckGo, falling back
# to Mojeek; render-aware) and parses Gitea `/src/branch/` URLs into repo/path.
# Keyless. Shares the common ForgeCodeProvider logic.
#
# Not enabled by default. Add "gitea" to the code list in ../02-search.toml:
#   code = ["grep_app", "duckduckgo", "mojeek", "gitea"]
#
# (No settings — documentation only.)
