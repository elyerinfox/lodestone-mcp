# -----------------------------------------------------------------------------
# Provider: github  (kind: code) — composite
# -----------------------------------------------------------------------------
# Keyless by default: a site-scoped web scrape of github.com (the same shared
# forge logic as gitlab/codeberg/gitea; honors per-call render). If a token is
# set below, it instead uses GitHub's AUTHENTICATED code-search API (GitHub no
# longer allows unauthenticated *API* code search — the scrape path doesn't need
# one). The token is used only for code search; github_fetch_file downloads raw
# files without it.
#
# Enable by adding "github" to the code list in ../02-search.toml. To use the
# API path, set a token (a classic PAT with public_repo, or a fine-grained PAT
# with read-only Contents) — prefer the env var so it isn't committed.
# -----------------------------------------------------------------------------

[github]
# Optional. Empty = keyless web scrape; set = authenticated GitHub API.
# Env: LODESTONE_GITHUB_TOKEN (or GITHUB_TOKEN)
token = ""
