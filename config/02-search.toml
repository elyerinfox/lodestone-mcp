# =============================================================================
# config/02-search.toml — provider orchestration (strategy + ordering)
# =============================================================================
#
# This file decides WHICH providers run and in WHAT order. Each provider's own
# settings live in its file under config/providers/. For how results are scored
# and merged (the composite ranker, signals, tuning), see ../docs/ranking.md.
# -----------------------------------------------------------------------------

[search]
# "fallback" = first non-empty result wins (fast).
# "aggregate" = run all concurrently, dedupe + re-rank (meta-search).
# Env: LODESTONE_SEARCH_STRATEGY
strategy = "fallback"

# How "aggregate" re-ranks the merged results (ignored by "fallback"):
#   "composite"  = multi-signal default: weighted Reciprocal Rank Fusion (k=60)
#                  × cross-engine consensus × lexical query relevance × authority,
#                  then domain-diversified (MMR). Strongest, most robust.
#   "reciprocal" = Σ 1/(rank+1) — high placement + cross-engine agreement
#   "borda"      = Σ (N − rank) — linear positional scoring
#   "breadth"    = consensus: how many engines returned it (best position breaks ties)
#   "interleave" = round-robin: each engine's 1st, then 2nd, … (max source diversity)
# Env: LODESTONE_SEARCH_RANKING
ranking = "composite"

# Composite ranker tuning (optional):
# Per-engine quality weights (id -> weight, default 1.0) used by the RRF term.
#   [search.engine_weights]
#   duckduckgo = 1.0
#   mojeek     = 0.8
# Extra domains given an authority boost, on top of a small built-in set
# (stackoverflow.com, developer.mozilla.org, docs.rs, github.com, …):
#   trusted_domains = ["internal.docs.corp"]
trusted_domains = []

# Per-request HTTP timeout (seconds) shared by every scraping/API call, so one
# slow source can't dominate latency. Each engine/forge request also gets a
# single short-backoff retry on a transient failure.
# Env: LODESTONE_SEARCH_TIMEOUT_SECS
timeout_secs = 25

# Optional PER-KIND overrides of strategy/ranking. Empty/unset fields inherit the
# global values above. Lets you e.g. aggregate web+code for coverage while keeping
# qa on fallback (so the StackExchange API isn't always hit). Uncomment to use:
#   [search.web]
#   strategy = "aggregate"
#   ranking  = "breadth"
#   [search.code]
#   strategy = "aggregate"
#   [search.qa]
#   strategy = "fallback"

[providers]
# Ordered lists per kind. See config/providers/<id>.toml for each provider.
#   web ids:  duckduckgo, mojeek, medium, google, searxng
#   code ids: grep_app, duckduckgo, mojeek, google, github,
#             gitlab, codeberg, gitea, searxng, <your [forges.*] ids>
#   qa ids:   stackoverflow
#   docs ids: cratesio, npm, mdn   (keyless package/doc registries)
# (`google` drives a headless browser — needs a local Chrome. `github` is
#  keyless by default (web scrape) and uses the GitHub API only if a token is
#  set. gitlab/codeberg/gitea are keyless per-forge code providers. `searxng`
#  needs [searxng].url set. Self-hosted forge ids come from config/04-forges.toml.)
# Env: LODESTONE_WEB_PROVIDERS / LODESTONE_CODE_PROVIDERS / LODESTONE_QA_PROVIDERS
#      / LODESTONE_DOCS_PROVIDERS
web = ["duckduckgo", "mojeek"]
code = ["grep_app", "duckduckgo", "mojeek"]
qa = ["stackoverflow"]
docs = ["cratesio", "npm", "mdn"]
