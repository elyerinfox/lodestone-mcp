# =============================================================================
# config/02-search.toml — provider orchestration (strategy + ordering)
# =============================================================================
#
# This file decides WHICH providers run and in WHAT order. Each provider's own
# settings live in its file under config/providers/.
# -----------------------------------------------------------------------------

[search]
# "fallback" = first non-empty result wins (fast).
# "aggregate" = run all concurrently, dedupe + re-rank (meta-search).
# Env: LODESTONE_SEARCH_STRATEGY
strategy = "fallback"

# How "aggregate" re-ranks the merged results (ignored by "fallback"):
#   "reciprocal" = Σ 1/(rank+1) — high placement + cross-engine agreement (default)
#   "borda"      = Σ (N − rank) — linear positional scoring
#   "breadth"    = consensus: how many engines returned it (best position breaks ties)
#   "interleave" = round-robin: each engine's 1st, then 2nd, … (max source diversity)
# Env: LODESTONE_SEARCH_RANKING
ranking = "reciprocal"

[providers]
# Ordered lists per kind. See config/providers/<id>.toml for each provider.
#   web ids:  duckduckgo, mojeek, medium, google
#   code ids: grep_app, duckduckgo, mojeek, google, github,
#             gitlab, codeberg, gitea  (per-forge providers)
#   qa ids:   stackoverflow
# (`google` drives a headless browser — needs a local Chrome. `github` is
#  keyless by default (web scrape) and uses the GitHub API only if a token is
#  set. gitlab/codeberg/gitea are keyless per-forge code providers.)
# Env: LODESTONE_WEB_PROVIDERS / LODESTONE_CODE_PROVIDERS / LODESTONE_QA_PROVIDERS
web = ["duckduckgo", "mojeek"]
code = ["grep_app", "duckduckgo", "mojeek"]
qa = ["stackoverflow"]
