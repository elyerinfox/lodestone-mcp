# =============================================================================
# config/01-tools.toml — which tools (skills) are exposed
# =============================================================================
#
# Each tool is independent. Filtering applies to BOTH tools/list and dispatch
# (a hidden tool returns "tool not found").
#
# General tools: web_search, code_search, docs_search, qa_search, fetch_page,
#        render_page, webpage_to_pdf, read_pdf, fetch_repo_file, wayback_fetch,
#        github_releases, github_user, github_repo, datetime, date_diff,
#        time_convert, translate, detect_language, docker_search, docker_image,
#        docker_tags, oci_tags, oci_manifest, artifacthub_search, list_providers,
#        hive_status
# Local Docker daemon (gated by [docker] in 08-docker.toml): docker_ps,
#        docker_images, docker_inspect, docker_logs, docker_info, docker_pull,
#        docker_run, docker_start, docker_stop, docker_remove
# Kubernetes (gated by [kubernetes] in 09-kubernetes.toml): k8s_contexts, k8s_get,
#        k8s_describe, k8s_logs, k8s_apply, k8s_scale, k8s_delete
# Local utilities: json_query, json_format, yaml_to_json, json_to_yaml,
#        regex_search, regex_replace, math_eval, math_solve, convert_units
# IETF: rfc_get, rfc_search
# Standards: standards_search (IEEE/SAE/NIST/ISO/… metadata via Crossref)
# Research/ML: arxiv_search, arxiv_get, hf_search, hf_model
# Reference: wikipedia_search, wikipedia_summary, kernel_releases
# Filesystem (gated by [filesystem] in 10-filesystem.toml; OFF by default): fs_read,
#        fs_list, fs_stat, fs_find, fs_write, fs_edit, fs_mkdir, fs_delete, fs_move
# Shell (gated by [shell] in 11-shell.toml; OFF by default): shell_run
# Per-provider tools: one per configured provider, named <kind>_<id>
#        (e.g. web_mojeek, code_github, qa_stackoverflow). Auto-generated from
#        02-search.toml; filter them here by those names just like any tool.
#        StackOverflow also adds qa_stackoverflow_answers (read a question's
#        body + top answers) — a provider-specific skill.
# -----------------------------------------------------------------------------

[tools]
# Allowlist; empty = expose all.   Env: LODESTONE_TOOLS_ENABLED
enabled = []
# Denylist, applied after `enabled`. Env: LODESTONE_TOOLS_DISABLED
disabled = []
