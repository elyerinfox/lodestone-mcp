# =============================================================================
# config/01-tools.toml — which tools (skills) are exposed
# =============================================================================
#
# Each tool is independent. Filtering applies to BOTH tools/list and dispatch
# (a hidden tool returns "tool not found").
#
# General tools: web_search, code_search, fetch_page, render_page,
#        fetch_repo_file, stackexchange_search, stackexchange_answers,
#        wayback_fetch, list_providers
# Per-provider tools: one per configured provider, named <kind>_<id>
#        (e.g. web_mojeek, code_github, qa_stackoverflow). Auto-generated from
#        02-search.toml; filter them here by those names just like any tool.
# -----------------------------------------------------------------------------

[tools]
# Allowlist; empty = expose all.   Env: LODESTONE_TOOLS_ENABLED
enabled = []
# Denylist, applied after `enabled`. Env: LODESTONE_TOOLS_DISABLED
disabled = []
