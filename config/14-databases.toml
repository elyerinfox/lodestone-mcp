# =============================================================================
# config/14-databases.toml — database client skills (off by default)
# =============================================================================
#
# NO PRECONFIGURATION: there are no stored connections or credentials here. When
# enabled, the model is given a connection URL in the conversation and passes it on
# each call. Tools: db_query (postgres/mysql), redis_command (redis).
#
# Reads run immediately; writes/DDL (SQL) and write/admin commands (Redis) are
# DESTRUCTIVE — the first call returns a confirmation token and does nothing, then
# you call again with confirm=<token> (or confirm + trust=true to whitelist that
# connection for the session). allow_destructive = true pre-authorizes (skips the
# prompt). Connection URLs are credentials — never logged or returned (summaries
# show only scheme + host).
# Env: LODESTONE_DATABASES_ENABLED, LODESTONE_DATABASES_ALLOW_DESTRUCTIVE
# -----------------------------------------------------------------------------

[databases]
enabled = false           # OFF by default — set true to expose db_query / redis_command
allow_destructive = false # true = skip the per-write confirmation prompt
