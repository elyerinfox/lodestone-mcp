# =============================================================================
# config/13-sysinfo.toml — system-information skills (read-only)
# =============================================================================
#
# Read-only host facts: OS/kernel/uptime, CPU (model, cores, usage), memory/swap,
# mounted disks, OS release (Linux), and GPU stats for NVIDIA (NVML), AMD (Linux
# DRM sysfs), and Intel (Linux DRM sysfs). Each vendor is its own tool with its
# own capability gate so unavailable backends short-circuit cleanly. No writes,
# so on by default.
#
# Tools: system_info, system_disks, system_gpu_nvidia, system_gpu_amd,
#        system_gpu_intel, system_os_release.
# -----------------------------------------------------------------------------

[sysinfo]
# Expose the system_* tools. Env: LODESTONE_SYSINFO_ENABLED
enabled = true
