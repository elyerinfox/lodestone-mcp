# =============================================================================
# config/06-network.toml — constellation (peer-to-peer shared query knowledge)
# =============================================================================
#
# **OFF by default — strictly opt-in.** Standalone operation needs zero
# configuration; the constellation is a *helper* layered on top that lets
# instances consult each other's caches before scraping the open web, spreading
# load and softening per-IP rate limits. Set `enabled = true` below to join,
# add static peer URLs / leave mDNS on to discover them on the LAN, then read
# docs/constellation.md for the two-node test and trust model. With zero peers
# everything still works locally.
#
# Privacy & trust: only *hashes* of query keys cross the wire (never raw queries),
# and responses carry only cached search results (public web data), never secrets.
# Peer data is untrusted — a result is returned without a local search only when
# `min_agreement` peers corroborate it, each peer's influence is capped, and peers
# are weighted by a reputation earned by agreeing with consensus/local truth.
#
# Enabling the network implies the result cache is active (the constellation serves from
# it), even if [cache].enabled is false. See docs/constellation.md for the full design
# and a two-node test.
# -----------------------------------------------------------------------------

[network]
# Master switch — OFF by default. Flip to true to join a constellation.
# Env: LODESTONE_NETWORK_ENABLED
enabled = false

# SEPARATE host:port for the /constellation/* endpoints. The MCP endpoint stays
# private on `bind` (default 127.0.0.1:8000 — local clients only); the constellation
# is what other lodestone-mcp instances reach over the LAN, so it gets its own
# externally-bindable listener here. Default 0.0.0.0:8801 — LAN-reachable so mDNS
# auto-discovery and direct peer fetches both work without further config.
# Set to "" to share the MCP `bind` (localhost-only, peers can only connect from
# the same host); set to "127.0.0.1:8801" to keep it loopback-only without
# exposing the MCP port too.
# Env: LODESTONE_NETWORK_BIND
bind = "0.0.0.0:8801"

# Static peer base URLs (no trailing /). Env: LODESTONE_NETWORK_PEERS (comma-sep)
#   peers = ["http://10.0.0.2:8000", "http://10.0.0.3:8000"]
peers = []

# Auto-discover peers on the LAN via mDNS (_lodestone._tcp.local.). Only runs when
# enabled=true; set false to disable. Env: LODESTONE_NETWORK_MDNS
# (Peers also GOSSIP their known peers in each digest, so the mesh grows from a
#  seed; unreachable peers are pruned. Inspect the graph with the constellation_status tool.)
mdns = true

# Optional shared secret for the /constellation endpoints (separate from the public
# auth_token). When set, peers must present `Authorization: Bearer <token>` and
# outbound peer requests include it. Env: LODESTONE_NETWORK_TOKEN
token = ""

# Port advertised to peers / via mDNS. 0 = derive from `bind`.
advertise_port = 0

# How often (seconds) to refresh peers' digests.
sync_secs = 30
# Per-peer request timeout (milliseconds) — bounds how long a slow peer can stall.
request_timeout_ms = 1500
# Maximum peers consulted for one query.
max_peers = 16
# Maximum results accepted from any one peer (caps a single peer's influence).
max_results_per_peer = 10
# Peers that must corroborate a result before it's trusted without a local search.
# >= 2 means no single (possibly malicious) peer can inject a result.
min_agreement = 2

# How many hops a consult may be relayed through intermediary peers when this node
# can't reach a holder directly (the mesh routes the query for you). 0 = no relay;
# clamped to 2 max. Each relayed peer is still only ONE consensus vote, so relay
# can't fabricate corroboration.
relay_hops = 1

# Stable per-NODE id. Empty = derived from the OS machine id (machine-uid; falls
# back to hostname, else random) mixed with the bind port — stable across restarts
# and distinct per instance on one host. Set explicitly to override.
# Env: LODESTONE_NETWORK_NODE_ID
node_id = ""

# The shared CONSTELLATION id — common to all member nodes (distinct from node_id
# above). **Leave empty — the recommended default.** A random id is chosen at
# startup, and nodes that reach each other CONVERGE to the larger mesh's id (with
# the alphabetically-smaller id as the tiebreaker on equal sizes), so multiple
# meshes on one network MERGE into a single constellation automatically. Pinning a
# specific id risks two unrelated networks accidentally merging if they happen to
# share it — leave this empty and let the merge rule handle convergence.
# Env: LODESTONE_NETWORK_ID
id = ""

# Optional path to persist peer reputations across restarts (JSON map of
# url -> reputation). Empty = no persistence. Env: LODESTONE_NETWORK_STATE_FILE
#   state_file = "lodestone-constellation-state.json"
state_file = ""

# -----------------------------------------------------------------------------
# [network.capabilities] — per-feature opt-in for what THIS node offers peers.
# -----------------------------------------------------------------------------
# Each peer publishes its capability set on its digest; the
# `constellation_capabilities` tool answers "who can do X?". Delegation requests
# for a capability the target peer hasn't opted in to are refused with a clear
# error. These flags only gate INBOUND requests from constellation peers —
# this node's own MCP client is never affected by them.
#
# Defaults reflect "share the cheap stuff, refuse the expensive/risky stuff":
#   query     = true   answer cache consults (the whole point of joining a mesh)
#   retrieval = false  accept URL-fetching jobs (mirrors `delegation_enabled`)
#   blob      = true   serve file-store blobs we already cached
#   browser   = false  accept delegated browser actions (much higher trust
#                      surface than serving a cached search result)
[network.capabilities]
query = true
retrieval = false
blob = true
browser = false

# -----------------------------------------------------------------------------
# [galaxy] — link CONSTELLATIONS across networks via a rendezvous broker.
# -----------------------------------------------------------------------------
# ENTIRELY OPTIONAL and off by default. A constellation is fully functional without
# any galaxy; this only ADDS cross-network discovery of other constellations.
#
# A constellation (above) is one directly-discovered mesh. A *galaxy* is the layer
# up: a tiny public broker that keeps a directory of { constellation -> public
# endpoint(s) }. It is NOT a proxy — it never relays digests/queries/blobs; it only
# hands back endpoints so constellations talk DIRECTLY over /constellation/*.
#
# The BROKER is a SEPARATE program — run the `lodestone-galaxy` binary on a publicly
# reachable host. It is configured by its own env (not this file):
#   LODESTONE_GALAXY_BIND      host:port to listen on        (default 0.0.0.0:8077)
#   LODESTONE_GALAXY_TOKEN     optional shared secret         (must match below)
#   LODESTONE_GALAXY_TTL_SECS  evict an idle constellation    (default 90)
#   $ lodestone-galaxy 0.0.0.0:8077       # or set LODESTONE_GALAXY_BIND
#
# This [galaxy] section is only the PARTICIPATING side (this constellation joining
# brokers). At least one host must be publicly reachable — the broker, plus each
# constellation's `ingress` node(s) with a forwarded/open port (see [network].bind
# above to expose ONLY the constellation port, not the MCP server).
[galaxy]
# Broker base URLs to register with / query. Empty = don't join any galaxy.
# Requires the constellation above to be enabled. A node joins its OWN constellation
# first (warm-up) before reaching out. Env: LODESTONE_GALAXY_SERVERS (comma list)
#   servers = ["http://broker.example.net:8077"]
servers = []
# Override the id this constellation registers under. Empty = use the shared
# constellation id ([network].id above) — recommended, so all member nodes appear
# as ONE constellation. Env: LODESTONE_GALAXY_ID
id = ""
# This constellation's PUBLICLY-REACHABLE ingress base URLs (what peers connect to).
# List several member nodes to distribute inbound load. Env: LODESTONE_GALAXY_INGRESS
#   ingress = ["http://203.0.113.10:8801", "http://203.0.113.11:8801"]
ingress = []
# Optional shared secret for the broker's /galaxy/* endpoints (match the broker's
# LODESTONE_GALAXY_TOKEN). Env: LODESTONE_GALAXY_TOKEN
token = ""
# How often (seconds) to register + pull the directory.
heartbeat_secs = 30
# Seconds to let local discovery settle before contacting a broker
# (returns sooner once a local peer appears).
join_warmup_secs = 20
