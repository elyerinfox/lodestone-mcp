[package]
name = "lodestone-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server that searches and retrieves code from the web by scraping search engines (no API keys)."
license = "MIT"

[dependencies]
rmcp = { version = "1.7", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7"
axum = "0.8"
reqwest = { version = "0.13", default-features = true, features = ["gzip", "brotli", "json", "query", "form"] }
scraper = "0.21"
html2text = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
async-trait = "0.1"
toml = "0.9"
anyhow = "1"
url = "2"
regex = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Headless-Chrome automation: powers the renderer (per-call `render`), the
# Google engine, and StackOverflow render-scraping. Compiled in unconditionally;
# a Chrome/Chromium binary is only needed at runtime if those paths are used.
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
mdns-sd = "0.20.0"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
pdf-extract = "0.10.0"

# Local Docker daemon control via the Engine API over the platform socket
# (Windows named pipe / unix socket). Direct API, no docker CLI dependency.
bollard = "0.18"
# Direct Kubernetes API access (reads kubeconfig; no kubectl dependency).
kube = { version = "0.99", default-features = false, features = ["client", "config", "rustls-tls"] }
k8s-openapi = { version = "0.24", features = ["latest"] }
serde_yaml = "0.9"
# Math expression evaluator (arithmetic/scientific) for the math skills.
meval = "0.2"
# Read-only XML parser for the arXiv Atom API.
roxmltree = "0.20"
# POSIX-style command tokenizer for the shell skill's allowlist (exec without a shell).
shell-words = "1"
# Build a tar of a Docker build context (docker_build); bytes for the build body.
tar = "0.4"
bytes = "1"
# Optional shared cache backend: a Redis store multiple instances can share.
# Only used when [cache].backend = "redis"; the default is the in-memory cache.
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
# System-information skill: cross-platform host/CPU/memory/disk (Linux /proc, Windows
# via the OS APIs). GPU stats via NVML (loaded at runtime; absent = graceful error).
sysinfo = "0.32"
nvml-wrapper = "0.10"
# Stable per-machine id for the hivemind node identity (OS machine GUID).
machine-uid = "0.5"
# Database client skills: PostgreSQL + MySQL via sqlx (Redis reuses the `redis`
# crate above). Only used when a [databases.*] instance is configured.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "chrono"] }
