[package]
name = "lodestone-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server that searches and retrieves code from the web by scraping search engines (no API keys)."
license = "MIT"

[dependencies]
rmcp = { version = "1.7", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7"
axum = "0.8"
reqwest = { version = "0.13", default-features = true, features = ["gzip", "brotli", "json", "query", "form"] }
scraper = "0.21"
html2text = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
async-trait = "0.1"
toml = "0.9"
anyhow = "1"
url = "2"
regex = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Optional: headless-Chrome Google provider (enable with --features google).
# Pulls in a browser-automation stack and requires Chrome/Chromium at runtime.
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"], optional = true }

[features]
default = []
# Headless-browser rendering (its own capability). Enables the PageRenderer
# and the `render` option on fetch_page.
browser = ["dep:chromiumoxide"]
# The Google provider builds on the headless renderer.
google = ["browser"]
