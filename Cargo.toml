[package]
name = "lodestone-mcp"
version = "0.1.6"
edition = "2021"
description = "MCP server that searches and retrieves code from the web by scraping search engines (no API keys)."
license = "MIT"

[dependencies]
rmcp = { version = "1.7", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7"
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.13", default-features = true, features = ["gzip", "brotli", "json", "query", "form", "socks"] }
scraper = "0.21"
html2text = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
async-trait = "0.1"
toml = "0.9"
anyhow = "1"
url = "2"
regex = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Used by `browser_screenshot` to encode PNG bytes into a JSON-safe string.
base64 = "0.22"

# Headless-Chrome automation: powers the renderer (per-call `render`), the
# Google engine, and StackOverflow render-scraping. Compiled in unconditionally;
# a Chrome/Chromium binary is only needed at runtime if those paths are used.
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
mdns-sd = "0.20.0"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
pdf-extract = "0.10.0"

# Local Docker daemon control via the Engine API over the platform socket
# (Windows named pipe / unix socket). Direct API, no docker CLI dependency.
bollard = "0.18"
# Direct Kubernetes API access (reads kubeconfig; no kubectl dependency).
kube = { version = "0.99", default-features = false, features = ["client", "config", "rustls-tls"] }
k8s-openapi = { version = "0.24", features = ["latest"] }
serde_yaml = "0.9"
# Math expression evaluator (arithmetic/scientific) for the math skills.
meval = "0.2"
# Read-only XML parser for the arXiv Atom API.
roxmltree = "0.20"
# POSIX-style command tokenizer for the shell skill's allowlist (exec without a shell).
shell-words = "1"
# Build a tar of a Docker build context (docker_build); bytes for the build body.
tar = "0.4"
bytes = "1"
# Optional shared cache backend: a Redis store multiple instances can share.
# Only used when [cache].backend = "redis"; the default is the in-memory cache.
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
# System-information skill: cross-platform host/CPU/memory/disk (Linux /proc, Windows
# via the OS APIs). GPU stats via NVML (loaded at runtime; absent = graceful error).
sysinfo = "0.32"
nvml-wrapper = "0.10"
# Stable per-machine id for the constellation node identity (OS machine GUID).
machine-uid = "0.5"
# Satellite trajectory: SGP4 orbital propagation from TLE element sets.
sgp4 = "2"
# Raw serial-device I/O for the serial skill (off by default). default-features
# off drops the Linux `libudev` system dependency (which CI/musl lack); port
# enumeration falls back to a sysfs/dev scan there.
serialport = { version = "4", default-features = false }
# Database client skills: PostgreSQL + MySQL via sqlx (Redis reuses the `redis`
# crate above). Only used when a [databases.*] instance is configured.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "chrono", "macros"] }
# Spreadsheet skill (off by default): CSV/TSV via `csv`, XLSX/XLS/ODS reads via
# `calamine`, XLSX writes via `rust_xlsxwriter`. Only used by the sheet_* tools.
csv = "1"
calamine = "0.26"
rust_xlsxwriter = "0.79"
# Signal-processing skill (off by default): FFT, dominant frequencies, RMS.
rustfft = "6"
# WAV file decoding for the `wave_*` skill (off by default).
hound = "3"
# Binary analysis skill (off by default): ELF/PE/Mach-O metadata, strings,
# entropy, hexdump. `object` is pure Rust, no native deps.
object = { version = "0.36", default-features = false, features = ["read", "std"] }
# Pcap-file parsing for the `pcap_*` skill (off by default). Reads existing
# .pcap / .pcapng files; no native libpcap needed.
pcap-file = "2"
# EXIF metadata parsing for the `image_*` skills. Pure Rust, no native deps.
# Handles JPEG and TIFF containers + all standard tag types including GPS.
kamadak-exif = "0.6"
# x86/x64 disassembly for the `disasm_*` skill (off by default).
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "nasm", "fast_fmt"] }
# MQTT pub/sub client for the `mqtt_*` skill (off by default). Drives a single
# background event loop; publish/subscribe handles are cheap clones. The
# meshtastic skill layers on top — it reads Meshtastic-emitted JSON messages
# from the same MQTT subscription buffer and publishes back through the same
# client when sending mesh traffic.
rumqttc = { version = "0.25", default-features = false, features = ["use-native-tls"] }
# Numerical linear algebra surface used by tracking (Kalman family), nav aiding
# (DOP, ECEF/ECI transforms), and the cross-cutting `linalg_*` tools.
nalgebra = "0.33"
# Karney's geographiclib port — Vincenty/Karney geodesic, MGRS, geodesic polygon
# area. Powers the `geo_*` ellipsoidal suite.
geographiclib-rs = "0.2"
# Big-integer math for the crypto_math family (Miller-Rabin, modexp, CRT).
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
num-integer = "0.1"
# Elliptic-curve point operations exposed as math tools.
p256 = { version = "0.13", features = ["arithmetic"] }
# CRC variants (CRC-8/16/32/64 with arbitrary polynomial / init / xorout).
crc = "3"
# Key derivation function families surfaced as deterministic tools.
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hkdf = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# Reed-Solomon codec (channel coding).
reed-solomon-erasure = "6"
# Iterative LP solver — used by `opt_linprog`.
minilp = "0.2"
# Graph algorithms (Dijkstra, max-flow, Hungarian-style assignment).
pathfinding = "4"
# Acceptable rand source for SA/GA harnesses and particle filters.
rand = "0.8"
# Open-format converters: KML, GPX, well-known text/binary.
wkt = "0.10"
quick-xml = { version = "0.36", features = ["serialize"] }
gpx = "0.10"
