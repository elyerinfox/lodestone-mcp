# Two-service deployment: MCP server + standalone dashboard.
#
#   docker compose up --build
#
# Produces:
#   - MCP endpoint    http://localhost:8000/mcp     (lodestone service)
#   - Dashboard       http://localhost:8001/        (dashboard service)
#   - WebSocket feed  ws://localhost:8000/ws/status (lodestone service)
#   - Health          http://localhost:8000/health  + http://localhost:8001/health
#
# The dashboard SPA is served by nginx (frontend/Dockerfile). It talks
# to the MCP server's /ws/status via NUXT_PUBLIC_WS_URL, set from the
# host's perspective so the SPA running in your browser knows where to
# point. If you set [network].token on the MCP side, set the same
# value as NUXT_PUBLIC_WS_TOKEN here so the SPA can authenticate.
#
# To skip the dashboard entirely and just run the MCP server, comment
# out the `dashboard` service. The MCP container will still serve
# /dashboard, but it'll be the "not built" page — every other endpoint
# (/mcp, /ws/status, /api/settings/*, /constellation/*) works.
#
# To bake the dashboard INTO the MCP binary as a single artifact
# instead of running it as a separate container, see
# docs/building.md — the `make build-with-dashboard-docker` flow does
# this on the host so the binary embeds the SPA via include_dir!().

services:
  lodestone:
    build: .
    image: lodestone-mcp
    ports:
      - "8000:8000"
    environment:
      # The container ships Chromium; override the path if you bake in another.
      LODESTONE_CHROME_PATH: /usr/bin/chromium
      LODESTONE_CHROME_NO_SANDBOX: "1"
      # Opt into browser-backed providers / meta-search / extra forges / GitHub:
      # LODESTONE_WEB_PROVIDERS: "google,duckduckgo,mojeek"
      # LODESTONE_CODE_PROVIDERS: "github,grep_app,gitlab,codeberg,duckduckgo,mojeek"
      # LODESTONE_SEARCH_STRATEGY: "aggregate"
      # LODESTONE_CODE_SITES: "github.com,gitlab.com,codeberg.org"
      # LODESTONE_GITHUB_TOKEN: "ghp_..."
    # Mount the host's lodestone.toml into the container so the
    # personal-overrides file (gitignored, may carry tokens) takes
    # effect on the compose-running binary. Without this the container
    # only sees the baked-in config/ baseline. Comment out to fall
    # back to the shipped defaults.
    volumes:
      - ./lodestone.toml:/app/lodestone.toml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The SPA runs in YOUR browser, so the URL is from the
        # browser's perspective (the host's published port), not the
        # dashboard container's perspective. Rebuild with a different
        # value if you publish the MCP service somewhere else:
        #   docker compose build --build-arg NUXT_PUBLIC_WS_URL=… dashboard
        NUXT_PUBLIC_WS_URL: ws://localhost:8000/ws/status
    image: lodestone-dashboard
    ports:
      - "8001:80"
    depends_on:
      lodestone:
        condition: service_healthy
    restart: unless-stopped
