# For running inside the provided Docker image (which bundles Chromium). The
# image already sets equivalent values via environment variables; this file is
# the config-file equivalent.
#
#   Usage:  docker run -p 8000:8000 \
#             -v "$PWD/examples/docker.toml:/app/lodestone.toml:ro" lodestone-mcp

# Bind on all interfaces so the published port is reachable from the host.
bind = "0.0.0.0:8000"

# Binding to 0.0.0.0 exposes /mcp beyond localhost — set a bearer token so it
# isn't open. Prefer the env var (e.g. `docker run -e LODESTONE_AUTH_TOKEN=…`)
# over writing the secret here.
auth_token = ""

[search]
strategy = "aggregate"

[providers]
web  = ["google", "duckduckgo", "mojeek"]
code = ["grep_app", "duckduckgo", "mojeek"]
qa   = ["stackoverflow"]

[code]
sites = ["github.com", "gitlab.com", "codeberg.org"]

[stackexchange]
default_site = "stackoverflow"

[google]
# Path to the Chromium that ships in the image.
chrome_path = "/usr/bin/chromium"
# Chrome runs as root in the container, so the sandbox must be disabled.
no_sandbox  = true
