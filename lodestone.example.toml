# lodestone-mcp configuration — copy to `lodestone.toml` and edit.
#
# Loaded from ./lodestone.toml (or the path in $LODESTONE_CONFIG). Every value
# is optional; omitted values fall back to the built-in defaults shown here.
# Environment variables override the file:
#   LODESTONE_BIND, LODESTONE_SEARCH_STRATEGY,
#   LODESTONE_WEB_PROVIDERS, LODESTONE_CODE_PROVIDERS, LODESTONE_QA_PROVIDERS,
#   LODESTONE_CODE_SITES, LODESTONE_STACKEXCHANGE_SITE,
#   LODESTONE_CHROME_PATH, LODESTONE_CHROME_NO_SANDBOX, LODESTONE_CHROME_ARGS,
#   LODESTONE_GITHUB_TOKEN (or GITHUB_TOKEN).

# host:port the Streamable-HTTP server binds to. MCP endpoint is <bind>/mcp.
# Use 0.0.0.0 to accept connections from outside the host (e.g. in Docker).
bind = "127.0.0.1:8000"

[search]
# How the providers of a kind are combined:
#   "fallback"  - try them in order; first non-empty result set wins (fast).
#   "aggregate" - query them all concurrently, then dedupe and re-rank the
#                 merged results (a built-in SearXNG-style meta-search).
strategy = "fallback"

# In "fallback" mode providers are tried left-to-right (first to return results
# wins). In "aggregate" mode all of them run and the results are merged.
[providers]
# Known web providers:  duckduckgo, mojeek, medium, google*
web = ["duckduckgo", "mojeek"]
# Known code providers: grep_app, duckduckgo, mojeek, github**, google*
code = ["grep_app", "duckduckgo", "mojeek"]
# Known Q&A providers:  stackoverflow  (keyless API; pass render=true on the call
#                       to scrape stackoverflow.com via a headless browser*)
qa = ["stackoverflow"]
#  * "google" and qa render=true require building with --features google (or
#    browser) and a local Chrome/Chromium.
#  ** "github" requires a token (see [github] below).
#
# Examples (uncomment to use):
# web  = ["google", "duckduckgo", "mojeek", "medium"]
# code = ["github", "grep_app", "duckduckgo", "mojeek"]

[code]
# Forge domains that code_search is scoped to (via `site:` on the web
# providers). Add more forges to search them alongside GitHub.
sites = ["github.com"]
# e.g. sites = ["github.com", "gitlab.com", "codeberg.org", "gitea.com"]

[stackexchange]
# Default site for stackexchange_search / stackexchange_answers when a call
# doesn't specify one (e.g. serverfault, superuser, askubuntu, unix, ...).
default_site = "stackoverflow"
# Optional API key — not a login, just raises the per-IP quota (~300/day →
# ~10k/day). Prefer the LODESTONE_STACKEXCHANGE_KEY env var over committing it.
key = ""
# Guardrail: if non-empty, only these sites may be searched/read; any other
# site is rejected. Empty = allow any site.
allowed_sites = []

[google]
# Only used with --features browser/google. Path to Chrome/Chromium; empty =
# auto-detect an installed browser.
chrome_path = ""
# Add --no-sandbox / --disable-dev-shm-usage (needed when Chrome runs as root,
# e.g. inside a container).
no_sandbox = false
# Extra Chrome flags.
args = []

[github]
# Optional. GitHub no longer allows unauthenticated code search, so the `github`
# code provider needs a token (classic, or fine-grained with read access).
# Prefer setting this via the GITHUB_TOKEN env var rather than committing it.
token = ""
